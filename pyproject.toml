# 项目根配置：命令任务的统一入口（poe）
#
# 本文件不声明 Python 项目，仅承载跨端任务编排；
# 后端的依赖管理、pytest 与 ruff 配置见 backend/pyproject.toml。
#
# 前置要求（一次性）：uv tool install poethepoet
# 用法：在项目根目录执行 poe <task>

# ---- 后端 ----
[tool.poe.tasks]
test = { cmd = "uv run --directory backend pytest", help = "离线测试" }
test-live = { cmd = "uv run --directory backend pytest -m live", help = "live 契约测试（消耗真实 API 额度）" }
lint = { cmd = "uv run --directory backend ruff check .", help = "Ruff 代码检查（只检查，不修改）" }
lint-fix = { cmd = "uv run --directory backend ruff check --fix .", help = "Ruff 代码检查并自动修复" }
format = { cmd = "uv run --directory backend ruff format .", help = "Ruff 代码格式化" }
format-check = { cmd = "uv run --directory backend ruff format --check .", help = "Ruff 格式检查（只检查，不修改）" }
typecheck = { cmd = "uv run --directory backend basedpyright", help = "basedpyright 类型检查" }
chat = { cmd = "uv run --directory backend python -m src.application", help = "终端冒烟对话（需配置 backend/.env）" }

# 静态自检：lint + typecheck
[tool.poe.tasks.check]
sequence = ["lint", "typecheck"]
help = "同时运行 lint + typecheck"

# ---- 前端（待 frontend/ 建立后启用，命令按实际包管理器调整）----
# 启用时将以下任务追加到上方 [tool.poe.tasks] 一节中：
# dev = "pnpm --dir frontend dev"
# build = "pnpm --dir frontend build"
# preview = "pnpm --dir frontend preview"
